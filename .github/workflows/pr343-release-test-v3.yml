name: PR343 release test v3

on:
  push:
    branches:
      - test/pr343-be8eef7-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prove source delta is workflow-only
        shell: bash
        run: |
          set -euo pipefail
          files="$(git diff --name-only be8eef7be8b5a884fa6e5656e52f60086d723862 HEAD)"
          printf '%s\n' "$files"
          test "$files" = ".github/workflows/pr343-release-test-v3.yml"

      - name: Compile authority code
        run: python -m compileall -q forgeboss/control forgeboss/policy forgeboss/security forgeboss/executors

      - name: Focused governed-launch tests
        run: |
          python -m unittest -v forgeboss.control.test_governed_launch
          python -m unittest -v forgeboss.control.test_governed_task_create

      - name: Policy tests
        if: always()
        run: python -m unittest discover -v -s forgeboss/policy -p "test_*.py"

      - name: Control tests
        if: always()
        run: python -m unittest discover -v -s forgeboss/control -p "test_*.py"

      - name: Security tests
        if: always()
        run: python -m unittest discover -v -s forgeboss/security -p "test_*.py"

      - name: Executor selftest
        if: always()
        run: node forgeboss/tests/selftest.js

      - name: Unified security selftest
        if: always()
        run: python forgeboss/security/selftest.py

      - name: Latest control selftest
        if: always()
        run: python forgeboss/control/selftest_v214.py

      - name: Remove test runtime state
        if: always()
        shell: bash
        run: rm -rf state

      - name: Final clean-source check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain)"
