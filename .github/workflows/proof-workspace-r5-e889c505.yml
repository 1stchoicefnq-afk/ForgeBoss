name: Proof Workspace R5 e889c505
on: push
permissions:
  contents: read
jobs:
  exact-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e889c50501ea20acc5e90e0e78ca248ad82aa8d8
          persist-credentials: false
      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "e889c50501ea20acc5e90e0e78ca248ad82aa8d8"
      - name: Install protected dependency
        run: python -m pip install cryptography
      - name: Run Workspace V7 tests
        run: python -m unittest forgeboss.control.test_workspace_v7 -v
      - name: Compile Workspace files
        run: python -m py_compile forgeboss/control/workspace.py forgeboss/control/workspace_state.py forgeboss/control/test_workspace_v7.py
