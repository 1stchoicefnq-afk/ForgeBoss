name: Workspace V6 exact3 builder current-main
on:
  push:
    branches:
      - forgeboss/worker-c-workspace-v6-exact3-builder-current-main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Construct exact3 from accepted current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forgeboss/worker-c-workspace-v6-crashfix-patcher forgeboss/worker-c-workspace-v6-patched-temp2
          git show origin/forgeboss/worker-c-workspace-v6-crashfix-patcher:.github/workspace_v6_crashfix.py > /tmp/workspace_v6_crashfix.py
          git checkout f5a6af4e6433b84034e057cf9c70f5abc3a6ad76
          git checkout e8d40eb7d616a0ae2679d7d7fd9efb357a2d93a1 -- forgeboss/control/workspace.py forgeboss/control/test_workspace.py forgeboss/control/windows_cleanup.py
          python /tmp/workspace_v6_crashfix.py
          python -m py_compile forgeboss/control/workspace.py forgeboss/control/test_workspace.py forgeboss/control/windows_cleanup.py
          python -m unittest forgeboss.control.test_workspace -v
          git diff --name-only f5a6af4e6433b84034e057cf9c70f5abc3a6ad76 -- | tee /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 3
          grep -Fxq 'forgeboss/control/workspace.py' /tmp/changed.txt
          grep -Fxq 'forgeboss/control/test_workspace.py' /tmp/changed.txt
          grep -Fxq 'forgeboss/control/windows_cleanup.py' /tmp/changed.txt
      - name: Publish one-commit exact3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Worker C Workspace V6'
          git config user.email 'worker-c@users.noreply.github.com'
          git checkout -b forgeboss/worker-c-workspace-v6-exact3-current-main
          git add forgeboss/control/workspace.py forgeboss/control/test_workspace.py forgeboss/control/windows_cleanup.py
          git commit -m 'Workspace V6: crash-safe handle-bound cleanup'
          test "$(git rev-list --count f5a6af4e6433b84034e057cf9c70f5abc3a6ad76..HEAD)" -eq 1
          git push origin HEAD:refs/heads/forgeboss/worker-c-workspace-v6-exact3-current-main
