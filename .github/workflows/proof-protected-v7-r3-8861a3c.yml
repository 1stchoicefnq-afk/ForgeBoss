name: Proof Protected V7 R3 8861a3c
on:
  push:
    branches:
      - forgeboss/proof-protected-v7-r3-8861a3c
permissions:
  contents: read
jobs:
  exact-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8861a3ca1d00b04e5edabdc1735fa42a04c65a82
          persist-credentials: false
      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "8861a3ca1d00b04e5edabdc1735fa42a04c65a82"
      - name: Run protected authority tests
        run: python -m unittest discover -s forgeboss/protected_authority -p "test_*.py" -v
      - name: Compile protected authority tree
        run: python -m compileall -q forgeboss/protected_authority
