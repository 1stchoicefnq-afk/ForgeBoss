name: Collision R5 exact tests
on:
  push:
    branches:
      - forgeboss/controller-test-collision-r5-exact
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact Collision R5 source
        shell: bash
        run: |
          git merge-base --is-ancestor 6942fb627ea7291c0857039d271123869f38746c HEAD
          git diff --quiet 6942fb627ea7291c0857039d271123869f38746c HEAD -- forgeboss
          test "$(git rev-parse 6942fb627ea7291c0857039d271123869f38746c^{tree}:forgeboss)" = "$(git rev-parse HEAD^{tree}:forgeboss)"
      - name: Run exact Collision R5 suites
        run: python -m unittest forgeboss.control.test_store_repository_identity forgeboss.control.test_store_transactions -v
