name: FB079 R9 integration proof
on:
  push:
    branches: [forgeboss/controller-test-fb079-r9-integration]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact integration source Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f94b1ba7b165155fd7bd2421aa5bebd2e333dfdd HEAD
          git diff --quiet f94b1ba7b165155fd7bd2421aa5bebd2e333dfdd HEAD -- forgeboss
          test "$(git rev-parse f94b1ba7b165155fd7bd2421aa5bebd2e333dfdd^{tree}:forgeboss)" = "$(git rev-parse HEAD^{tree}:forgeboss)"
      - name: Verify exact integration source Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git merge-base --is-ancestor f94b1ba7b165155fd7bd2421aa5bebd2e333dfdd HEAD
          if ($LASTEXITCODE -ne 0) { throw 'integration candidate not ancestor' }
          git diff --quiet f94b1ba7b165155fd7bd2421aa5bebd2e333dfdd HEAD -- forgeboss
          if ($LASTEXITCODE -ne 0) { throw 'forgeboss source changed' }
          $a=(git rev-parse 'f94b1ba7b165155fd7bd2421aa5bebd2e333dfdd^{tree}:forgeboss').Trim()
          $b=(git rev-parse 'HEAD^{tree}:forgeboss').Trim()
          if ($a -ne $b) { throw 'forgeboss tree mismatch' }
      - name: FB079 focused metadata suite
        run: python -m unittest forgeboss.security.test_executor_guard_git_metadata -v
      - name: Paid-start suite when present
        shell: bash
        if: runner.os != 'Windows'
        run: |
          if [ -f forgeboss/security/test_executor_guard_paid_start.py ]; then
            python -m unittest forgeboss.security.test_executor_guard_paid_start -v
          else
            echo 'paid_start_test_absent_on_current_main=true'
          fi
      - name: Paid-start suite when present Windows
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          if (Test-Path 'forgeboss/security/test_executor_guard_paid_start.py') {
            python -m unittest forgeboss.security.test_executor_guard_paid_start -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host 'paid_start_test_absent_on_current_main=true'
          }
      - name: Broad security regression discovery
        run: python -m unittest discover -s forgeboss/security -p 'test_*.py' -v
      - name: Native stock Git trust probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "from pathlib import Path; from forgeboss.security import executor_guard as g; p=g._resolve_git_executable(); g._assert_windows_git_trust(Path(p).resolve()); print('R9_INTEGRATION_WINDOWS_STOCK_GIT_PASS',p)"
