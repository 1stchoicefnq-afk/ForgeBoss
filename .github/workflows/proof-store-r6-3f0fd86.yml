name: Proof Store R6 3f0fd86
on: push
permissions:
  contents: read
jobs:
  exact-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3f0fd86ccb5ae24dc5275b74d869c8ca8df7fac3
          persist-credentials: false
      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "3f0fd86ccb5ae24dc5275b74d869c8ca8df7fac3"
      - name: Run Store R6 focused
        run: python -m unittest forgeboss.control.test_store_authority_r6 -v
      - name: Run Store stack
        run: python -m unittest forgeboss.control.test_store_authority forgeboss.control.test_store_authority_v3 forgeboss.control.test_store_repository_identity forgeboss.control.test_store_transactions forgeboss.control.test_daemon_budget -v
      - name: Compile Store
        run: python -m py_compile forgeboss/control/store.py forgeboss/control/test_store_authority_r6.py
