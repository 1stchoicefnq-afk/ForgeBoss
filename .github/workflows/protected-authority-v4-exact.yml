name: Protected Authority V4 exact Windows proof
on:
  push:
    branches:
      - forgeboss/controller-test-protected-authority-v4-exact
permissions:
  contents: read
jobs:
  windows-ffi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify candidate source unchanged
        shell: pwsh
        run: |
          git cat-file -e 6189bbb2bbc1e516b4f7cd9e0d32f13c51c4bb8b^{commit}
          git diff --exit-code 6189bbb2bbc1e516b4f7cd9e0d32f13c51c4bb8b -- forgeboss/protected_authority
      - name: Compile protected authority
        run: python -m compileall -q forgeboss/protected_authority
      - name: Run native V4 Win32 FFI tests
        run: python -m unittest forgeboss.protected_authority.test_v4 -v
  linux-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify candidate source unchanged
        run: |
          git cat-file -e 6189bbb2bbc1e516b4f7cd9e0d32f13c51c4bb8b^{commit}
          git diff --exit-code 6189bbb2bbc1e516b4f7cd9e0d32f13c51c4bb8b -- forgeboss/protected_authority
      - name: Compile protected authority
        run: python -m compileall -q forgeboss/protected_authority
      - name: Run protected-authority portable regressions
        run: python -m unittest forgeboss.protected_authority.test_service forgeboss.protected_authority.test_v2 forgeboss.protected_authority.test_v3 forgeboss.protected_authority.test_v4 -v
