name: Protected Authority V7 temp4 proof
on:
  push:
    branches:
      - forgeboss/controller-test-protected-authority-v7-temp4
permissions:
  contents: read
jobs:
  linux-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify exact temp source
        run: git diff --exit-code 66d42d755ddeeabe4734631e6d5967ec90b24e45 -- forgeboss/protected_authority
      - run: python -m compileall -q forgeboss/protected_authority
      - run: python -m unittest forgeboss.protected_authority.test_v7 forgeboss.protected_authority.test_v6 forgeboss.protected_authority.test_v3 -v
  windows-v7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify exact temp source
        shell: pwsh
        run: git diff --exit-code 66d42d755ddeeabe4734631e6d5967ec90b24e45 -- forgeboss/protected_authority
      - run: python -m compileall -q forgeboss/protected_authority
      - run: python -m unittest forgeboss.protected_authority.test_v7 forgeboss.protected_authority.test_v6 forgeboss.protected_authority.test_v4 -v
