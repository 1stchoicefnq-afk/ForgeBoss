name: Protected Authority V7-R2 exact proof
on:
  push:
    branches:
      - forgeboss/controller-test-protected-v7-r2-exact
permissions:
  contents: read
jobs:
  linux-v7-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify exact candidate source unchanged
        run: git diff --exit-code 3863013369fa36cc17408a3c287a4e9ca857810c -- forgeboss/protected_authority
      - run: python -m compileall -q forgeboss/protected_authority
      - name: Run Linux V8 and inherited authority regressions
        run: python -m unittest discover -s forgeboss/protected_authority -p 'test_*.py' -v
  windows-v7-r2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify exact candidate source unchanged
        shell: pwsh
        run: git diff --exit-code 3863013369fa36cc17408a3c287a4e9ca857810c -- forgeboss/protected_authority
      - run: python -m compileall -q forgeboss/protected_authority
      - name: Run Windows V8 and inherited authority regressions
        run: python -m unittest discover -s forgeboss/protected_authority -p 'test_*.py' -v
