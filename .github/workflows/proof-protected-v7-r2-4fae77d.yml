name: Proof Protected V7 R2 4fae77d

on:
  push:
    branches:
      - forgeboss/proof-protected-v7-r2-4fae77d

permissions:
  contents: read

jobs:
  exact-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4fae77d1b9470d7a4e5da1b6f6a06051fb5591a9
          persist-credentials: false
      - name: Verify exact SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "4fae77d1b9470d7a4e5da1b6f6a06051fb5591a9"
      - name: Run protected authority tests
        run: python -m unittest discover -s forgeboss/protected_authority -p "test_*.py" -v
      - name: Compile protected authority tree
        run: python -m compileall -q forgeboss/protected_authority
