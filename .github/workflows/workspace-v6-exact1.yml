name: Workspace V6 exact1
on:
  push:
    branches: [forgeboss/worker-c-test-workspace-v6-exact1]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact V6 source Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ca644b6ef77643cd776e893297e47825f573965c HEAD
          git diff --quiet ca644b6ef77643cd776e893297e47825f573965c HEAD -- forgeboss
          test "$(git rev-parse ca644b6ef77643cd776e893297e47825f573965c^{tree}:forgeboss)" = "$(git rev-parse HEAD^{tree}:forgeboss)"
      - name: Verify exact V6 source Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git merge-base --is-ancestor ca644b6ef77643cd776e893297e47825f573965c HEAD
          if ($LASTEXITCODE -ne 0) { throw 'V6 candidate not ancestor' }
          git diff --quiet ca644b6ef77643cd776e893297e47825f573965c HEAD -- forgeboss
          if ($LASTEXITCODE -ne 0) { throw 'forgeboss source changed' }
          $a=(git rev-parse 'ca644b6ef77643cd776e893297e47825f573965c^{tree}:forgeboss').Trim()
          $b=(git rev-parse 'HEAD^{tree}:forgeboss').Trim()
          if ($a -ne $b) { throw 'forgeboss tree mismatch' }
      - name: Workspace V6 focused suite
        run: python -m unittest forgeboss.control.test_workspace -v
