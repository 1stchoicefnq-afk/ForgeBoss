name: Claude Hostile Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-review')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout exact PR review target
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.event.pull_request.head.sha }}

      - name: Verify requested exact head when supplied
        shell: bash
        env:
          REVIEW_REQUEST_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          body = os.environ.get("REVIEW_REQUEST_BODY", "")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip().lower()
          print("checked_out_head=" + actual)
          m = re.search(r"(?im)expected\s+head\s*:\s*`?([0-9a-f]{40})`?", body)
          if not m:
              print("No explicit expected head supplied; exact-head assertion not requested.")
              raise SystemExit(0)
          expected = m.group(1).lower()
          print("expected_head=" + expected)
          if actual != expected:
              print("TARGET MISMATCH: refusing Claude review", file=sys.stderr)
              raise SystemExit(12)
          print("Exact-head binding PASS")
          PY

      - name: Run Claude hostile review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          trigger_phrase: '@claude-review'
          claude_args: |
            --allowedTools "Bash(node:*),Bash(python3:*),Bash(python:*),Bash(npm:*),Bash(npx:*),Bash(powershell:*),Bash(pwsh:*)"
