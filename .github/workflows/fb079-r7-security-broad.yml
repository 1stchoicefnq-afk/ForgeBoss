name: FB-079 R7 broad security tests

on:
  push:
    branches:
      - forgeboss/worker-c-test-fb079-r7-security-broad

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact R7 source
        shell: bash
        run: |
          git merge-base --is-ancestor 3782f8a1ef095087942b91b1d39e722f856607e5 HEAD
          git diff --quiet 3782f8a1ef095087942b91b1d39e722f856607e5 HEAD -- forgeboss
          test "$(git rev-parse 3782f8a1ef095087942b91b1d39e722f856607e5^{tree}:forgeboss)" = "$(git rev-parse HEAD^{tree}:forgeboss)"
      - name: Run broad executor-guard tests
        run: |
          python -m unittest forgeboss.security.test_executor_guard_git_metadata -v
          python -m unittest forgeboss.security.test_executor_guard_paid_start -v
