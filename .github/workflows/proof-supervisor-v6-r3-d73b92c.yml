name: Proof Supervisor V6 R3 d73b92c
on:
  push:
    branches:
      - forgeboss/proof-supervisor-v6-r3-d73b92c
permissions:
  contents: read
jobs:
  exact-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d73b92c33c743d5074100ef36d333e5a987844fe
          persist-credentials: false
      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "d73b92c33c743d5074100ef36d333e5a987844fe"
      - name: Run Supervisor tests
        run: python -m unittest forgeboss.control.test_process_supervisor -v
      - name: Compile exact files
        run: python -m py_compile forgeboss/control/process_supervisor.py forgeboss/control/test_process_supervisor.py
