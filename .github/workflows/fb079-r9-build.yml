name: FB-079 R9 build patch
on:
  push:
    branches:
      - forgeboss/worker-c-test-fb079-r9-builder
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgeboss/worker-c-fb079-r9-ace-ancestor-trust
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch exact R8 parent into R9
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "ce42bed9de06f284d5bd0994eb625c974253878f"
          python - <<'PY'
          from pathlib import Path

          guard=Path('forgeboss/security/executor_guard.py')
          tests=Path('forgeboss/security/test_executor_guard_git_metadata.py')
          s=guard.read_text(encoding='utf-8')
          t=tests.read_text(encoding='utf-8')

          def replace_once(text,old,new,label):
              count=text.count(old)
              if count!=1: raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old,new,1)

          s=replace_once(s,
          '_WIN_WRITE_RIGHTS=0x500D0156\n',
          '_WIN_WRITE_RIGHTS=0x500D0156\n_WIN_PARENT_REPLACE_RIGHTS=0x000C0040\n_WIN_ALLOW_ACE_TYPES=frozenset((0,5,9,11))\n_WIN_DENY_ACE_TYPES=frozenset((1,6,10,12))\n_WIN_OBJECT_ACE_TYPES=frozenset((5,6,11,12))\n',
          'constants')

          old='''def _windows_allow_ace_sid_offset(ace_type:int,object_flags:int=0):
              if ace_type in (0,9):return 8
              if ace_type in (5,11):return 12+(16 if object_flags & 0x1 else 0)+(16 if object_flags & 0x2 else 0)
              return None
          '''
          new='''def _windows_allow_ace_sid_offset(ace_type:int,object_flags:int=0):
              if ace_type in (0,9):return 8
              if ace_type in (5,11):return 12+(16 if object_flags & 0x1 else 0)+(16 if object_flags & 0x2 else 0)
              return None
          def _windows_checked_ace_sid_offset(ace_type:int,ace_size:int,object_flags:int=0):
              if ace_type not in _WIN_ALLOW_ACE_TYPES|_WIN_DENY_ACE_TYPES:raise SecurityError("unsupported Windows DACL ACE type: "+str(ace_type))
              if not isinstance(ace_size,int) or ace_size<16 or ace_size%4:raise SecurityError("malformed Windows DACL ACE size")
              if ace_type in _WIN_OBJECT_ACE_TYPES:
                  if object_flags & ~0x3:raise SecurityError("malformed Windows object ACE flags")
                  offset=12+(16 if object_flags & 0x1 else 0)+(16 if object_flags & 0x2 else 0)
              else:offset=8
              if offset+8>ace_size:raise SecurityError("malformed Windows DACL ACE layout")
              return offset
          '''
          s=replace_once(s,old,new,'ACE helper')

          old='''        adv.GetAce.argtypes=[V,D,ctypes.POINTER(V)];adv.GetAce.restype=wintypes.BOOL
                  kernel.LocalFree.argtypes=[V];kernel.LocalFree.restype=V
          '''
          new='''        adv.GetAce.argtypes=[V,D,ctypes.POINTER(V)];adv.GetAce.restype=wintypes.BOOL
                  adv.IsValidSid.argtypes=[V];adv.IsValidSid.restype=wintypes.BOOL
                  adv.GetLengthSid.argtypes=[V];adv.GetLengthSid.restype=D
                  kernel.LocalFree.argtypes=[V];kernel.LocalFree.restype=V
          '''
          s=replace_once(s,old,new,'SID prototypes')

          old='''            header=ctypes.cast(ace,ctypes.POINTER(ACE_HEADER)).contents
                      ace_type=int(header.AceType);base=int(ace.value);object_flags=ctypes.c_uint32.from_address(base+8).value if ace_type in (5,11) else 0
                      offset=_windows_allow_ace_sid_offset(ace_type,object_flags)
                      if offset is None:continue
                      sid_addr=base+offset
                      sid=V(sid_addr);text=sid_text(sid)
                      trustee_sids[text.casefold()]=(text,sid_addr)
          '''
          new='''            header=ctypes.cast(ace,ctypes.POINTER(ACE_HEADER)).contents
                      ace_type=int(header.AceType);ace_size=int(header.AceSize);base=int(ace.value)
                      if ace_size<16 or ace_size%4:raise SecurityError("malformed Windows DACL ACE size: "+str(path))
                      object_flags=ctypes.c_uint32.from_address(base+8).value if ace_type in _WIN_OBJECT_ACE_TYPES else 0
                      offset=_windows_checked_ace_sid_offset(ace_type,ace_size,object_flags)
                      sid_addr=base+offset
                      subauth_count=int(ctypes.c_ubyte.from_address(sid_addr+1).value);sid_len=8+4*subauth_count
                      if sid_len<8 or offset+sid_len>ace_size:raise SecurityError("malformed Windows DACL SID bounds: "+str(path))
                      sid=V(sid_addr)
                      if not adv.IsValidSid(sid) or int(adv.GetLengthSid(sid))!=sid_len:raise SecurityError("invalid Windows DACL SID: "+str(path))
                      if ace_type in _WIN_DENY_ACE_TYPES:continue
                      text=sid_text(sid);trustee_sids[text.casefold()]=(text,sid_addr)
          '''
          s=replace_once(s,old,new,'ACE parser')

          old='''def _assert_windows_acl_trust(path:Path):
              owner,rights=_windows_acl_facts(path);trusted=_windows_trusted_principal_sids()
              if str(owner).casefold() not in trusted:raise SecurityError("untrusted Windows Git path owner: "+str(path))
              for sid,mask in rights.items():
                  if str(sid).casefold() not in trusted and int(mask) & _WIN_WRITE_RIGHTS:
                      raise SecurityError("untrusted principal has write-capable Git path rights: "+str(sid)+" -> "+str(path))
          '''
          new='''def _assert_windows_acl_mask(path:Path,deny_mask:int,reason:str):
              owner,rights=_windows_acl_facts(path);trusted=_windows_trusted_principal_sids()
              if str(owner).casefold() not in trusted:raise SecurityError("untrusted Windows Git path owner: "+str(path))
              for sid,mask in rights.items():
                  if str(sid).casefold() not in trusted and int(mask) & int(deny_mask):
                      raise SecurityError(reason+str(sid)+" -> "+str(path))
          def _assert_windows_acl_trust(path:Path):
              return _assert_windows_acl_mask(path,_WIN_WRITE_RIGHTS,"untrusted principal has write-capable Git path rights: ")
          def _assert_windows_parent_replacement_trust(path:Path):
              return _assert_windows_acl_mask(path,_WIN_PARENT_REPLACE_RIGHTS,"untrusted principal has replacement-capable parent rights: ")
          '''
          s=replace_once(s,old,new,'ACL trust')

          old='''def _assert_windows_git_trust(resolved:Path):
              roots=_windows_trusted_roots();matches=[r for r in roots if _windows_within(resolved,r)]
              if not matches:raise SecurityError("untrusted Git-for-Windows install path: "+str(resolved))
              root=max(matches,key=lambda x:len(_windows_path_key(x)));cur=resolved
              while True:
                  if is_linklike(cur) or _windows_reparse(cur):raise SecurityError("linklike Git trust path denied: "+str(cur))
                  _assert_windows_acl_trust(cur)
                  if _windows_path_key(cur)==_windows_path_key(root):break
                  if cur.parent==cur:raise SecurityError("Git executable escaped trusted install root")
                  cur=cur.parent
          '''
          new='''def _assert_windows_git_trust(resolved:Path):
              roots=_windows_trusted_roots();matches=[r for r in roots if _windows_within(resolved,r)]
              if not matches:raise SecurityError("untrusted Git-for-Windows install path: "+str(resolved))
              root=max(matches,key=lambda x:len(_windows_path_key(x)));cur=resolved
              while True:
                  if is_linklike(cur) or _windows_reparse(cur):raise SecurityError("linklike Git trust path denied: "+str(cur))
                  _assert_windows_acl_trust(cur)
                  if _windows_path_key(cur)==_windows_path_key(root):break
                  if cur.parent==cur:raise SecurityError("Git executable escaped trusted install root")
                  cur=cur.parent
              if os.name=="nt":
                  anchor=str(root.anchor)
                  if not re.fullmatch(r"[A-Za-z]:\\\\",anchor):raise SecurityError("Git-for-Windows trust root is not on a local drive")
              volume=Path(root.anchor) if root.anchor else root
              ancestor=root.parent
              while True:
                  if is_linklike(ancestor) or _windows_reparse(ancestor):raise SecurityError("linklike Git ancestor trust path denied: "+str(ancestor))
                  if _windows_path_key(ancestor)==_windows_path_key(volume):
                      _assert_windows_parent_replacement_trust(ancestor);break
                  _assert_windows_acl_trust(ancestor)
                  if ancestor.parent==ancestor:raise SecurityError("Git trust chain has no stable volume boundary")
                  ancestor=ancestor.parent
          '''
          s=replace_once(s,old,new,'ancestor trust')

          old='''    def test_windows_callback_allow_ace_offsets_are_recognized(self):
                  self.assertEqual(guard._windows_allow_ace_sid_offset(9),8)
                  self.assertEqual(guard._windows_allow_ace_sid_offset(11),12)
                  self.assertEqual(guard._windows_allow_ace_sid_offset(11,0x1),28)
                  self.assertEqual(guard._windows_allow_ace_sid_offset(11,0x3),44)
                  self.assertIsNone(guard._windows_allow_ace_sid_offset(1))
          '''
          new='''    def test_windows_callback_allow_ace_offsets_are_recognized(self):
                  self.assertEqual(guard._windows_allow_ace_sid_offset(9),8)
                  self.assertEqual(guard._windows_allow_ace_sid_offset(11),12)
                  self.assertEqual(guard._windows_allow_ace_sid_offset(11,0x1),28)
                  self.assertEqual(guard._windows_allow_ace_sid_offset(11,0x3),44)
                  self.assertIsNone(guard._windows_allow_ace_sid_offset(1))

              def test_windows_ace_layout_classification_fails_closed(self):
                  self.assertEqual(guard._windows_checked_ace_sid_offset(0,20),8)
                  self.assertEqual(guard._windows_checked_ace_sid_offset(1,20),8)
                  self.assertEqual(guard._windows_checked_ace_sid_offset(9,24),8)
                  self.assertEqual(guard._windows_checked_ace_sid_offset(10,24),8)
                  self.assertEqual(guard._windows_checked_ace_sid_offset(5,24),12)
                  self.assertEqual(guard._windows_checked_ace_sid_offset(6,24),12)
                  self.assertEqual(guard._windows_checked_ace_sid_offset(11,56,0x3),44)
                  self.assertEqual(guard._windows_checked_ace_sid_offset(12,56,0x3),44)
                  for args in ((2,20,0),(0,12,0),(0,18,0),(5,20,0x4),(11,44,0x3)):
                      with self.subTest(args=args),self.assertRaises(guard.SecurityError):guard._windows_checked_ace_sid_offset(*args)
          '''
          t=replace_once(t,old,new,'ACE tests')

          old='''    def test_windows_acl_read_only_untrusted_principal_does_not_false_fail(self):
                  p=Path("/synthetic/git.exe")
                  rights={"S-1-5-32-544":guard._WIN_WRITE_RIGHTS,"S-1-5-21-111-222-333-1001":0x1200A9}
                  with patch.object(guard,"_windows_acl_facts",return_value=("S-1-5-32-544",rights)):guard._assert_windows_acl_trust(p)
          '''
          new='''    def test_windows_acl_read_only_untrusted_principal_does_not_false_fail(self):
                  p=Path("/synthetic/git.exe")
                  rights={"S-1-5-32-544":guard._WIN_WRITE_RIGHTS,"S-1-5-21-111-222-333-1001":0x1200A9}
                  with patch.object(guard,"_windows_acl_facts",return_value=("S-1-5-32-544",rights)):guard._assert_windows_acl_trust(p)

              def test_windows_parent_replacement_rights_are_narrow_and_fail_closed(self):
                  p=Path("/synthetic/volume")
                  trusted=frozenset({"s-1-5-18","s-1-5-32-544"})
                  safe={"S-1-5-18":guard._WIN_WRITE_RIGHTS,"S-1-5-11":0x1200AD}
                  with patch.object(guard,"_windows_trusted_principal_sids",return_value=trusted),patch.object(guard,"_windows_acl_facts",return_value=("S-1-5-18",safe)):
                      guard._assert_windows_parent_replacement_trust(p)
                  for bit in (0x40,0x40000,0x80000):
                      bad=dict(safe);bad["S-1-5-11"]=0x1200AD|bit
                      with self.subTest(bit=bit),patch.object(guard,"_windows_trusted_principal_sids",return_value=trusted),patch.object(guard,"_windows_acl_facts",return_value=("S-1-5-18",bad)):
                          with self.assertRaisesRegex(guard.SecurityError,"replacement-capable parent rights"):guard._assert_windows_parent_replacement_trust(p)
          '''
          t=replace_once(t,old,new,'parent replacement tests')

          old='''    def test_windows_trusted_install_policy_rejects_outside_root_and_checks_full_chain(self):
                  td=tempfile.TemporaryDirectory()
                  try:
                      root=Path(td.name);trusted=root/"Git";inside=trusted/"cmd"/"git.exe";inside.parent.mkdir(parents=True);inside.write_text("x");outside=root/"fake"/"git.exe";outside.parent.mkdir();outside.write_text("x")
                      safe={"S-1-5-18":0,"S-1-5-32-544":0,"S-1-5-11":0x1200A9}
                      with patch.object(guard,"_windows_trusted_roots",return_value=[trusted.resolve()]),patch.object(guard,"_windows_acl_facts",return_value=("S-1-5-18",safe)) as facts:
                          guard._assert_windows_git_trust(inside.resolve())
                          self.assertEqual([c.args[0] for c in facts.call_args_list],[inside.resolve(),inside.parent.resolve(),trusted.resolve()])
                          with self.assertRaisesRegex(guard.SecurityError,"untrusted Git-for-Windows install path"):guard._assert_windows_git_trust(outside.resolve())
                  finally:td.cleanup()
          '''
          new='''    def test_windows_trusted_install_policy_rejects_outside_root_and_checks_full_chain(self):
                  td=tempfile.TemporaryDirectory()
                  try:
                      root=Path(td.name);trusted=root/"Git";inside=trusted/"cmd"/"git.exe";inside.parent.mkdir(parents=True);inside.write_text("x");outside=root/"fake"/"git.exe";outside.parent.mkdir();outside.write_text("x")
                      safe={"S-1-5-18":0,"S-1-5-32-544":0,"S-1-5-11":0x1200A9}
                      with patch.object(guard,"_windows_trusted_roots",return_value=[trusted.resolve()]),patch.object(guard,"_windows_acl_facts",return_value=("S-1-5-18",safe)) as facts:
                          guard._assert_windows_git_trust(inside.resolve())
                          calls=[c.args[0] for c in facts.call_args_list]
                          self.assertEqual(calls[:3],[inside.resolve(),inside.parent.resolve(),trusted.resolve()])
                          self.assertIn(trusted.parent.resolve(),calls);self.assertIn(Path(trusted.anchor).resolve(),calls)
                          with self.assertRaisesRegex(guard.SecurityError,"untrusted Git-for-Windows install path"):guard._assert_windows_git_trust(outside.resolve())
                  finally:td.cleanup()

              def test_windows_ancestor_volume_allows_nonreplacement_rights_but_denies_delete_child(self):
                  td=tempfile.TemporaryDirectory()
                  try:
                      root=Path(td.name);trusted=root/"Git";inside=trusted/"cmd"/"git.exe";inside.parent.mkdir(parents=True);inside.write_text("x");volume=Path(trusted.anchor).resolve()
                      safe={"S-1-5-18":0,"S-1-5-32-544":0,"S-1-5-11":0x1200A9}
                      def facts(path):
                          if Path(path)==volume:return "S-1-5-18",{"S-1-5-18":guard._WIN_WRITE_RIGHTS,"S-1-5-11":0x1200AD}
                          return "S-1-5-18",safe
                      with patch.object(guard,"_windows_trusted_roots",return_value=[trusted.resolve()]),patch.object(guard,"_windows_acl_facts",side_effect=facts):guard._assert_windows_git_trust(inside.resolve())
                      def badfacts(path):
                          if Path(path)==volume:return "S-1-5-18",{"S-1-5-18":guard._WIN_WRITE_RIGHTS,"S-1-5-11":0x1200AD|0x40}
                          return "S-1-5-18",safe
                      with patch.object(guard,"_windows_trusted_roots",return_value=[trusted.resolve()]),patch.object(guard,"_windows_acl_facts",side_effect=badfacts):
                          with self.assertRaisesRegex(guard.SecurityError,"replacement-capable parent rights"):guard._assert_windows_git_trust(inside.resolve())
                  finally:td.cleanup()
          '''
          t=replace_once(t,old,new,'ancestor tests')

          guard.write_text(s,encoding='utf-8')
          tests.write_text(t,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'forgeboss/security/executor_guard.py\nforgeboss/security/test_executor_guard_git_metadata.py'
      - name: Run portable R9 suite
        run: |
          python -m unittest forgeboss.security.test_executor_guard_git_metadata -v
          python -m unittest forgeboss.security.test_executor_guard_paid_start -v
      - name: Commit R9 candidate
        shell: bash
        run: |
          git config user.name "Jake | Building SiteBoss"
          git config user.email "1stchoicefnq@gmail.com"
          git add forgeboss/security/executor_guard.py forgeboss/security/test_executor_guard_git_metadata.py
          git commit -m "FB-079 R9: fail closed ACL and ancestor trust"
          git push origin HEAD:forgeboss/worker-c-fb079-r9-ace-ancestor-trust
