name: ForgeBoss v2.2.7 full import

on:
  push:
    branches: [forgeboss-v227-full-import]
    paths:
      - '.forgeboss-import/**'
      - '.github/workflows/forgeboss-v227-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify source package
        shell: bash
        run: |
          set -euo pipefail
          PARTS=(.forgeboss-import/part-*.b64)
          if [ ! -e "${PARTS[0]}" ]; then
            echo 'Import parts are not present yet.'
            exit 0
          fi
          count=$(find .forgeboss-import -maxdepth 1 -name 'part-*.b64' -type f | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "Waiting for all 8 import parts; have $count."
            exit 0
          fi
          cat $(find .forgeboss-import -maxdepth 1 -name 'part-*.b64' -type f | sort) | base64 -d > /tmp/forgeboss-v227.zip
          echo 'b0d67af38d0a3a1c4970e4d474901a837337d5ee988e7c083fee5db6f5523b4c  /tmp/forgeboss-v227.zip' | sha256sum -c -
      - name: Extract exact ForgeBoss tree
        shell: python
        run: |
          import pathlib, zipfile, shutil
          repo = pathlib.Path('.').resolve()
          archive = pathlib.Path('/tmp/forgeboss-v227.zip')
          wrapper = 'ForgeBoss-v2.2.7-RELEASE-BLOCKER-GATE/'
          internal = wrapper + 'ForgeBoss-Internal/'
          preserve = {'.git', '.github', '.forgeboss-import'}
          for p in list(repo.iterdir()):
              if p.name in preserve:
                  continue
              if p.is_dir(): shutil.rmtree(p)
              else: p.unlink()
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename
                  if info.is_dir() or '__pycache__/' in name or name.endswith('.pyc'):
                      continue
                  if name.startswith(internal):
                      rel = name[len(internal):]
                  elif name == wrapper + 'START-FORGEBOSS.vbs':
                      rel = 'START-FORGEBOSS.vbs'
                  else:
                      continue
                  dest = repo / rel
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(info))
      - name: Commit imported tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .forgeboss-import
          rm -f .github/workflows/forgeboss-v227-import.yml
          git config user.name 'ForgeBoss Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete ForgeBoss v2.2.7 source tree'
          git push origin HEAD:forgeboss-v227-full-import
