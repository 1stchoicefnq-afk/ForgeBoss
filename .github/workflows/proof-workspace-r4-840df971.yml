name: Proof Workspace R4 840df971
on:
  push:
    branches:
      - forgeboss/proof-workspace-r4-840df971
permissions:
  contents: read
jobs:
  exact-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 840df971d0eef557de8b19369f902d67b876e95d
          persist-credentials: false
      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "840df971d0eef557de8b19369f902d67b876e95d"
      - name: Install protected dependency
        run: python -m pip install cryptography
      - name: Run Workspace V7 tests
        run: python -m unittest forgeboss.control.test_workspace_v7 -v
      - name: Run Workspace regression suite
        run: python -m unittest forgeboss.control.test_workspace -v
      - name: Compile Workspace files
        run: python -m py_compile forgeboss/control/workspace.py forgeboss/control/workspace_state.py forgeboss/control/test_workspace_v7.py
